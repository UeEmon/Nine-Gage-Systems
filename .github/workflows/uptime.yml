# 公開中の SenroLab が応答しているかを15分ごとに外から確かめる。落ちていればこのワークフローが失敗し、
# GitHub から所有者にメールが届く。URL はリポジトリの変数 NINEGAGE_HEALTH_URL（例 https://nine-gage.example.com/api/health）。
# 変数がなければ何もしない。60日間コミットがないと GitHub が定期実行を止めるので、そのときは Actions の画面で再開する。
name: Uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  health:
    if: vars.NINEGAGE_HEALTH_URL != ''
    runs-on: ubuntu-24.04
    steps:
      - name: /api/health が {"ok":true} を返す
        env:
          URL: ${{ vars.NINEGAGE_HEALTH_URL }}
        run: |
          for i in 1 2 3; do
            body=$(curl -fsS --max-time 15 "$URL") && [ "$body" = '{"ok":true}' ] && { echo "up: $URL"; exit 0; }
            sleep 30
          done
          echo "::error::SenroLab が応答しません: $URL"
          exit 1
